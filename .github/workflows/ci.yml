name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd cli && bun install && bun test && bun run test:stories

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd cli && bun install && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: cli/dist/dep-*

  # The standalone binaries must embed and load onnxruntime on their own — the
  # one thing a source-tree test cannot prove. Runs the local provider end to end.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dep-linux-x64
          - os: windows-latest
            binary: dep-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries
      - name: Smoke-test the binary with the local embedding provider
        shell: bash
        run: |
          chmod +x "binaries/${{ matrix.binary }}"
          BIN="$PWD/binaries/${{ matrix.binary }}"
          "$BIN" version
          "$BIN" validate --root . --json > /dev/null
          "$BIN" vectorize --root . --provider local --json
          "$BIN" search "lifecycle freshness" --semantic --root . --json | head -c 400
          "$BIN" context "how is a document's freshness decided" --budget 600 --root . --json | head -c 400
