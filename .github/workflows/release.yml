name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          cd cli && bun install
          if find . -name '*.test.*' -o -name '*.spec.*' | grep -q .; then
            bun test
          else
            echo "No test files found, skipping"
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd cli && bun install && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: cli/dist/dep-*

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dep-linux-x64
          - os: windows-latest
            binary: dep-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries
      - name: Smoke-test the binary with the local embedding provider
        shell: bash
        run: |
          chmod +x "binaries/${{ matrix.binary }}"
          BIN="$PWD/binaries/${{ matrix.binary }}"
          "$BIN" version
          "$BIN" vectorize --root . --provider local --json
          "$BIN" context "how is a document's freshness decided" --budget 600 --root . --json | head -c 400

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/dep-*
            install.sh
            install.ps1
          generate_release_notes: true

  publish-launcher:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@maxios'
      - run: cd packages/dep-mcp && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
